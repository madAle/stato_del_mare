name: CI

# La suite non vale niente se nessuno la esegue: senza questo workflow ogni
# affermazione di qualita' del repo poggia su un umano che si ricorda di
# lanciare pytest in locale.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      # Senza marcatore: i test di rete scaricano 23 MB dalla sorgente ARPAE e
      # non devono dipendere dalla disponibilita' di un servizio esterno.
      # `addopts` in pyproject.toml li deseleziona gia'.
      - name: Test
        run: uv run pytest

  web:
    # Solo typecheck e test unitari: i tre test end to end (web/e2e) aprono
    # un browser vero e leggono il bucket pubblico su rete, e restano da
    # eseguire a mano (npx playwright test dentro web/) prima di ogni merge.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test unitari
        run: npm test
