name: CI

# La suite non vale niente se nessuno la esegue: senza questo workflow ogni
# affermazione di qualita' del repo poggia su un umano che si ricorda di
# lanciare pytest in locale.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      # Senza marcatore: i test di rete scaricano 23 MB dalla sorgente ARPAE e
      # non devono dipendere dalla disponibilita' di un servizio esterno.
      # `addopts` in pyproject.toml li deseleziona gia'.
      - name: Test
        run: uv run pytest
