name: Ingestione ADRIAC

on:
  schedule:
    # ADRIAC gira **una volta al giorno** (16 file, sempre gli stessi nomi, con
    # la sola data nel nome: nessuna seconda emissione). Ingerire piu' spesso
    # non porta piu' dato: chiude la finestra cieca fra il momento in cui il
    # file esiste e quello in cui lo prendiamo.
    #
    # E quella finestra era larga perche' **l'ora di pubblicazione oscilla**.
    # I primi file della giornata escono alle 09:00 in punto, ma quello delle
    # onde (`his_HPDwave_fc`) e' fra gli ultimi della catena. Misurato
    # sull'indice ARPAE, sette giorni consecutivi di agosto 2026:
    #
    #   13/08 10:35   14/08 11:02   15/08 14:16   16/08 09:33
    #   17/08 10:09   18/08 13:01   19/08 15:31
    #
    # Sei ore di oscillazione. Con i due soli cron di prima (12:00 e 18:00),
    # su tre giorni su sette il dato arrivava dopo le 12 e restava invisibile
    # fino alle 18:00 UTC, cioe' le otto di sera.
    #
    # Il controllo a vuoto non costa quasi niente: la deduplica e' sull'impronta
    # del file sorgente registrata nel manifest, quindi si legge l'indice, si
    # confrontano le impronte e si finisce (misurato: 18 secondi). Il repository
    # e' pubblico, quindi i minuti di Actions non si pagano, e la guardia di
    # concorrenza qui sotto impedisce a due esecuzioni di accavallarsi.
    - cron: "0 9-19 * * *"
    # Rete di sicurezza per una giornata anomala, cosi' non si aspetta il
    # mattino dopo.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stampa il piano senza scrivere"
        type: boolean
        default: false
      rilavora:
        description: "Gruppi da rifare anche se gia' ingeriti, separati da virgola (es. his_temp,his_salt)"
        type: string
        default: ""

concurrency:
  group: ingestione
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Libera spazio su disco
        # I file 3D di previsione arrivano a quasi 2 GB compressi. Il runner
        # ne ha 14 di partenza, con diversi GB occupati da immagini inutili.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      # setup-uv non pubblica piu' i tag di major dalla v8: si aggancia alla
      # versione esatta, o al githash. Va alzato a mano quando esce una major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync

      - name: Riconcilia
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          RILAVORA: ${{ inputs.rilavora }}
        run: |
          set +e
          # Gli ingressi passano da variabili d'ambiente e non interpolati nel
          # comando: un valore scelto da chi lancia il workflow non deve poter
          # diventare shell.
          argomenti=()
          [ "$DRY_RUN" = "true" ] && argomenti+=(--dry-run)
          [ -n "$RILAVORA" ] && argomenti+=(--rilavora "$RILAVORA")
          uv run python -m ingest reconcile "${argomenti[@]}"
          codice=$?
          set -e
          # I codici di uscita esistono per distinguere "riprova domani" da
          # "serve un umano". Senza questo blocco GitHub li appiattirebbe tutti
          # su "step fallito" e la distinzione andrebbe persa proprio dove
          # serve, cioe' nella mail di notifica.
          case $codice in
            0) echo "Ingestione completata." ;;
            1) echo "::warning::Alcuni file non sono stati lavorati. Ritentabile: il run successivo recupera dalla finestra di 8 giorni." ;;
            2) echo "::error::GUASTO CHE NON SI RISOLVE DA SOLO. Il run si e' fermato. Serve intervento umano PRIMA del prossimo run. Quattro cause possibili, tutte nel log: la griglia sorgente e' cambiata (l'archivio si riempirebbe di valori nel posto sbagliato), le unita' di una variabile sono cambiate (numeri plausibili e sbagliati), una variabile attesa e' stata rinominata alla sorgente (nessun run successivo la fa tornare), oppure due stazioni diverse collidono sullo stesso identificativo (le loro storie si mescolerebbero in un archivio permanente)." ;;
            3) echo "::error::Configurazione incompleta: mancano credenziali o variabili d'ambiente. Ogni tentativo fallira' allo stesso modo finche' non viene corretta." ;;
            *) echo "::error::Uscita inattesa: $codice" ;;
          esac
          exit $codice
