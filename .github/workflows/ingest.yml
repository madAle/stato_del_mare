name: Ingestione ADRIAC

on:
  schedule:
    # I file ARPAE compaiono verso le 10:30 UTC. Il primo run ha un'ora e
    # mezza di margine, il secondo e' rete di sicurezza e di solito e' un
    # no-op che costa qualche richiesta HEAD.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stampa il piano senza scrivere"
        type: boolean
        default: false
      rilavora:
        description: "Gruppi da rifare anche se gia' ingeriti, separati da virgola (es. his_temp,his_salt)"
        type: string
        default: ""

concurrency:
  group: ingestione
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Libera spazio su disco
        # I file 3D di previsione arrivano a quasi 2 GB compressi. Il runner
        # ne ha 14 di partenza, con diversi GB occupati da immagini inutili.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      # setup-uv non pubblica piu' i tag di major dalla v8: si aggancia alla
      # versione esatta, o al githash. Va alzato a mano quando esce una major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync

      - name: Riconcilia
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          RILAVORA: ${{ inputs.rilavora }}
        run: |
          set +e
          # Gli ingressi passano da variabili d'ambiente e non interpolati nel
          # comando: un valore scelto da chi lancia il workflow non deve poter
          # diventare shell.
          argomenti=()
          [ "$DRY_RUN" = "true" ] && argomenti+=(--dry-run)
          [ -n "$RILAVORA" ] && argomenti+=(--rilavora "$RILAVORA")
          uv run python -m ingest reconcile "${argomenti[@]}"
          codice=$?
          set -e
          # I codici di uscita esistono per distinguere "riprova domani" da
          # "serve un umano". Senza questo blocco GitHub li appiattirebbe tutti
          # su "step fallito" e la distinzione andrebbe persa proprio dove
          # serve, cioe' nella mail di notifica.
          case $codice in
            0) echo "Ingestione completata." ;;
            1) echo "::warning::Alcuni file non sono stati lavorati. Ritentabile: il run successivo recupera dalla finestra di 8 giorni." ;;
            2) echo "::error::GUASTO CHE NON SI RISOLVE DA SOLO. Il run si e' fermato. Serve intervento umano PRIMA del prossimo run. Quattro cause possibili, tutte nel log: la griglia sorgente e' cambiata (l'archivio si riempirebbe di valori nel posto sbagliato), le unita' di una variabile sono cambiate (numeri plausibili e sbagliati), una variabile attesa e' stata rinominata alla sorgente (nessun run successivo la fa tornare), oppure due stazioni diverse collidono sullo stesso identificativo (le loro storie si mescolerebbero in un archivio permanente)." ;;
            3) echo "::error::Configurazione incompleta: mancano credenziali o variabili d'ambiente. Ogni tentativo fallira' allo stesso modo finche' non viene corretta." ;;
            *) echo "::error::Uscita inattesa: $codice" ;;
          esac
          exit $codice
