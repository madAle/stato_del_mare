name: Ingestione ADRIAC

on:
  schedule:
    # ADRIAC gira **una volta al giorno** (16 file, sempre gli stessi nomi, con
    # la sola data nel nome: nessuna seconda emissione). Ingerire piu' spesso
    # non porta piu' dato: chiude la finestra cieca fra il momento in cui il
    # file esiste e quello in cui lo prendiamo.
    #
    # E quella finestra era larga perche' **l'ora di pubblicazione oscilla**.
    # I primi file della giornata escono alle 09:00 in punto, ma quello delle
    # onde (`his_HPDwave_fc`) e' fra gli ultimi della catena. Misurato
    # sull'indice ARPAE, sette giorni consecutivi di agosto 2026:
    #
    #   13/08 10:35   14/08 11:02   15/08 14:16   16/08 09:33
    #   17/08 10:09   18/08 13:01   19/08 15:31
    #
    # Sei ore di oscillazione. Con i due soli cron di prima (12:00 e 18:00),
    # su tre giorni su sette il dato arrivava dopo le 12 e restava invisibile
    # fino alle 18:00 UTC, cioe' le otto di sera.
    #
    # Il controllo a vuoto non costa quasi niente: la deduplica e' sull'impronta
    # del file sorgente registrata nel manifest, quindi si legge l'indice, si
    # confrontano le impronte e si finisce (misurato: 18 secondi). Il repository
    # e' pubblico, quindi i minuti di Actions non si pagano, e la guardia di
    # concorrenza qui sotto impedisce a due esecuzioni di accavallarsi.
    #
    # Al minuto 17 e non a zero: GitHub accoda le esecuzioni programmate quando
    # e' sotto carico, e il minuto zero e' di gran lunga il piu' affollato (lo
    # dice la loro documentazione, che consiglia esplicitamente un altro minuto
    # dell'ora). Misurato qui: la prima esecuzione oraria, programmata alle
    # 10:00, e' partita alle 10:38. Trentotto minuti su una cadenza oraria si
    # mangiano meta' del guadagno per cui la cadenza esiste.
    #
    # E GitHub non le esegue tutte. Fino al 26 agosto 2026 ne partivano 10-12
    # al giorno; da allora circa quattro, verso le 14, le 18, le 21 e la
    # mezzanotte UTC, con ritardi fino a due ore. Nessuna risulta cancellata:
    # semplicemente non partono. La cadenza qui sotto resta quella voluta, ma
    # quella vera e' una ogni tre o quattro ore.
    - cron: "17 9-19 * * *"
    # Rete di sicurezza per una giornata anomala, cosi' non si aspetta il
    # mattino dopo.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stampa il piano senza scrivere"
        type: boolean
        default: false
      rilavora:
        description: "Gruppi da rifare anche se gia' ingeriti, separati da virgola (es. his_temp,his_salt)"
        type: string
        default: ""

concurrency:
  group: ingestione
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/riconcilia.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
      rilavora: ${{ inputs.rilavora || '' }}
    secrets: inherit

  # Parte solo se ARPAE ha respinto la prima macchina con un 403. Una macchina
  # nuova esce da un indirizzo nuovo, e il bando e' per blocco di indirizzi: i
  # respinti sono stati 6 su 146 run misurati, quindi due di fila respinti per
  # caso capitano una volta su qualche centinaio. Se capita, il run e' rosso,
  # ed e' giusto: potrebbe essere un bando generale.
  #
  # Prima di questo job un 403 voleva dire un run rosso e il dato in ritardo
  # fino al run successivo, cioe' di circa quattro ore: dieci run rossi su
  # quattordici fra agosto e ottobre 2026, nessuno dei quali chiedeva niente a
  # nessuno.
  altra-macchina:
    needs: ingest
    if: needs.ingest.outputs.rifiutato == 'true'
    uses: ./.github/workflows/riconcilia.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
      rilavora: ${{ inputs.rilavora || '' }}
      ultima_macchina: true
    secrets: inherit
